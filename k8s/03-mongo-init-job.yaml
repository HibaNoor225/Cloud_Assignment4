apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -e
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                echo "Waiting for $h:27017 ..."
                until mongosh --host "$h" --port 27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                  sleep 3
                done
                echo "$h is up"
              done

              if mongosh --host mongo-0.mongo --quiet --eval "rs.status().ok" >/dev/null 2>&1; then
                echo "Replica set rs0 is already initiated"
              else
                echo "Running rs.initiate() on mongo-0.mongo"
                mongosh --host mongo-0.mongo --quiet --eval '
                  printjson(rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  }))'
              fi

              echo "Waiting for a PRIMARY to be elected ..."
              until mongosh --host mongo-0.mongo --quiet --eval 'rs.status().members.some(m => m.stateStr === "PRIMARY")' | grep -q true; do
                sleep 2
              done

              echo "rs.status() members:"
              mongosh --host mongo-0.mongo --quiet --eval 'rs.status().members.forEach(m => print(m.name + "  " + m.stateStr))'
